<!doctype html>
<!-- The link-preview picture (1200×630) that scripts/og_images.mjs renders once per language into dist/og/<lang>.jpg. -->
<html><head><meta charset="utf-8"><style>
@font-face{font-family:Plex;src:url(../dist/fonts/plex-sans-400.woff2);font-weight:400}
@font-face{font-family:Plex;src:url(../dist/fonts/plex-sans-700.woff2);font-weight:700}
@font-face{font-family:Mono;src:url(../dist/fonts/jetbrains-mono-400.woff2)}
html,body{margin:0}
.card{width:1200px;height:630px;box-sizing:border-box;padding:64px 72px;position:relative;overflow:hidden;font-family:Plex;color:#f1f5fb;
  background:radial-gradient(900px 500px at 85% -10%,rgb(91 140 255/.35),transparent 60%),radial-gradient(700px 420px at -10% 110%,rgb(63 110 245/.22),transparent 60%),linear-gradient(160deg,#0d1424,#070b14)}
.wordmark{display:flex;align-items:center;gap:26px;font-size:64px;font-weight:700;letter-spacing:-.02em}
.mark{width:96px;height:96px;border-radius:26px;display:grid;place-items:center;background:linear-gradient(135deg,#5b8cff,#3f6ef5);box-shadow:0 18px 50px -12px rgb(91 140 255/.8),inset 0 1px 0 rgb(255 255 255/.3)}
.mark svg{width:62px;height:62px;fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.mark .fill{fill:#fff;stroke:none}
.dot{color:#7ea4ff}
h1{margin:48px 0 0;font-size:98px;line-height:1.05;font-weight:700;letter-spacing:-.03em;white-space:nowrap}
p{margin:18px 0 0;font-size:42px;color:#a9b6cf}
.link{position:absolute;left:72px;right:72px;bottom:56px;display:flex;align-items:center;gap:20px;padding:24px 30px;border-radius:24px;background:rgb(255 255 255/.05);border:1px solid rgb(255 255 255/.1)}
.url{flex:1;font-family:Mono;font-size:40px;color:#e6edf9}.url b{color:#7ea4ff;font-weight:400}
.expires{font-size:30px;font-weight:700;color:#86efac;background:rgb(34 197 94/.14);border:1px solid rgb(34 197 94/.35);padding:10px 22px;border-radius:999px;white-space:nowrap}
</style></head><body><div class="card">
<div class="wordmark"><div class="mark"><svg viewBox="0 0 24 24"><path class="fill" d="M5.5 6H10v4a2.5 2.5 0 0 0 2.5 2.5h3v6a2.5 2.5 0 0 1-2.5 2.5H5.5A2.5 2.5 0 0 1 3 18.5v-10A2.5 2.5 0 0 1 5.5 6Z"/><path d="M14.5 8.5 20 3M15.5 3H20v4.5"/></svg></div><span>fyl<span class="dot">.</span>at</span></div>
<h1 id="headline"></h1><p id="subline"></p>
<div class="link"><span class="url">fyl.at/d/<b>k7Qm2xR9</b></span><span class="expires" id="expires"></span></div>
</div></body></html>
